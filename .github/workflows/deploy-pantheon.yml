name: Deploy frontend → Pantheon (test)

# Ricostruisce l'export statico dai contenuti WordPress (API Pantheon) e lo
# pubblica nella webroot del sito Pantheon via git.
# Trigger:
#  - repository_dispatch (event "wp-content-updated"): inviato dal webhook WP
#    quando il cliente salva/pubblica un contenuto → aggiornamento ~automatico.
#  - workflow_dispatch: rebuild manuale (dashboard Actions o `gh workflow run`).
on:
  repository_dispatch:
    types: [wp-content-updated]
  workflow_dispatch: {}

concurrency:
  group: deploy-pantheon
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout progetto
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Build export (contenuti da Pantheon)
        working-directory: web
        env:
          # Build time: URL assoluto dell'API (dietro Lock → serve la basic auth)
          WP_API_URL: ${{ secrets.PANTHEON_SITE_URL }}/wp-json/mariani/v1
          WP_API_BASIC_AUTH: ${{ secrets.PANTHEON_BASIC_AUTH }}
          # Browser: stesso dominio → URL relativo (dietro la stessa Lock)
          NEXT_PUBLIC_WP_API_URL: /wp-json/mariani/v1
          NEXT_PUBLIC_SITE_URL: ${{ secrets.PANTHEON_SITE_URL }}
        run: npm run build

      - name: Configura SSH per Pantheon
        env:
          SSH_KEY: ${{ secrets.PANTHEON_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/pantheon
          chmod 600 ~/.ssh/pantheon
          cat >> ~/.ssh/config <<'CFG'
          Host *.drush.in
            IdentityFile ~/.ssh/pantheon
            IdentitiesOnly yes
            StrictHostKeyChecking no
            Port 2222
          CFG

      - name: Pubblica su Pantheon (git)
        env:
          PANTHEON_GIT_URL: ${{ secrets.PANTHEON_GIT_URL }}
        run: |
          set -e
          git clone "$PANTHEON_GIT_URL" /tmp/ptn
          cd /tmp/ptn
          # Rimuovo i vecchi artefatti dell'export (NON i file WordPress)
          rm -rf _next it en hero img leaflet
          rm -f index.html 404.html sitemap.xml robots.txt llms.txt llms-full.txt \
                og-default.png logo-mariani.png placeholder-car.svg favicon.ico \
                next.svg vercel.svg file.svg globe.svg window.svg
          # Copio il nuovo export nella webroot
          cp -R "$GITHUB_WORKSPACE/web/out/." .
          git config user.name "Mariani Deploy Bot"
          git config user.email "deploy@mariani.local"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m "Rebuild frontend statico (contenuti aggiornati)"
            git push origin HEAD:master
            echo "Frontend pubblicato su Pantheon."
          fi
