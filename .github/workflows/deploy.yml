name: Build & Deploy (static export → VHosting)

# Trigger:
#  - push su main (deploy del codice)
#  - repository_dispatch inviato dal webhook WordPress su publish/aggiornamento contenuti
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [wp-content-updated]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Serve a creare la release con l'export; nient'altro viene scritto.
    permissions:
      contents: write
    # Il contesto `secrets` non e utilizzabile nelle condizioni `if:` di uno
    # step (GitHub rifiuta l'intero workflow), quindi la condizione legge da
    # env. A livello di job sta SOLO lo zone id, che identifica la zona e non
    # e una credenziale: il token API resta nello step che lo usa, per non
    # esporlo alle action di terze parti che girano negli altri step.
    env:
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Stessa major della macchina di sviluppo: npm 10 e npm 11 risolvono
          # diversamente il peer optional @swc/helpers (next vuole 0.5.15,
          # @swc/core di next-intl >= 0.5.17) e `npm ci` rifiuterebbe il lockfile.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        env:
          # URL dell'API WordPress headless usato a BUILD TIME (fetch dei contenuti)
          WP_API_URL: ${{ secrets.WP_API_URL }}
          # Stesso URL ma esposto al BROWSER: serve al form contatti per il POST /lead
          # a runtime (in export statico l'URL va "cotto" nel bundle). Senza, il form
          # posterebbe sul dominio principale e non raggiungerebbe cms.<dominio>.
          NEXT_PUBLIC_WP_API_URL: ${{ secrets.WP_API_URL }}
          # URL pubblico del sito (per canonical, sitemap, hreflang, OG)
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
        run: npm run build

      - name: Verify export output
        working-directory: web
        run: test -f out/it/index.html && test -f out/en/index.html

      # Il pacchetto viene pubblicato, non spinto: il server di VHosting blocca
      # in modo intermittente le connessioni SSH in ingresso dai runner GitHub
      # (ban dinamico del firewall). Qui l'artefatto resta su GitHub e il server
      # se lo scarica da solo — vedi scripts/pull-deploy.sh.
      - name: Impacchetta l'export
        working-directory: web
        run: |
          tar -czf ../site.tar.gz -C out .
          sha256sum ../site.tar.gz | cut -d' ' -f1 > ../site.tar.gz.sha256
          ls -lh ../site.tar.gz

      - name: Pubblica il pacchetto come release "site-latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag mobile: una sola release, sempre sovrascritta, così il server
          # ha un URL stabile da cui scaricare.
          gh release delete site-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create site-latest site.tar.gz site.tar.gz.sha256 \
            --title "Ultimo export statico" \
            --notes "Build automatica da ${GITHUB_SHA}. Scaricata dal server tramite scripts/pull-deploy.sh."

      # Il purge della cache Cloudflare NON si fa qui: a questo punto il
      # pacchetto e solo pubblicato, il sito online e ancora quello vecchio.
      # Svuotare la cache adesso la riempirebbe di nuovo con i file vecchi.
      # Lo fa il server dopo aver scaricato e installato l'export
      # (scripts/pull-deploy.sh).
